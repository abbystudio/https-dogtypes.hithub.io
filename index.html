i:"🛋️",scores:{independence:3,companion:0}},{label:"抱抱贴贴，一起窝一下午",hint:"外面再吵，我们的小世界很安静",emoji:"🤍",scores:{companion:3,energy:0}}]}],Hn=[{id:"golden",name:"金毛寻回犬",shortName:"金毛",alias:"人间小太阳",emoji:"🦮",color:"#E8D9B9",accent:"#A98552",profile:{energy:3,social:3,independence:1,care:2,train:3,space:3,companion:3,climate:1},tags:["热情稳定","陪伴满分","喜欢互动"],quote:"你负责认真生活，它负责把每个普通日子摇成好心情。",copy:"你和金毛的默契，在于都愿意把温柔落到实处。你享受有回应的关系，也愿意为喜欢的人花时间，适合把狗狗当家人、把散步当日常的人。它不会让你的热情落空，你也不会嫌它的亲近太多。",flaw:"热情归热情，掉毛、运动量和幼犬期的“大马力”都很真实，不能只爱它乖的时候。"},{id:"labrador",name:"拉布拉多寻回犬",shortName:"拉布拉多",alias:"快乐生活搭子",emoji:"🐕‍🦺",color:"#D9C8AF",accent:"#8D7257",profile:{energy:3,social:3,independence:1,care:1,train:3,space:3,companion:3,climate:2},tags:["开朗直接","好动爱吃","合作力强"],quote:"和喜欢的伙伴一起出门，平凡的一天也能有新发现。",copy:"你身上有种简单直给的快乐，和拉布拉多很对味。你愿意参与、乐于分享，适合喜欢规律运动、把生活过得热热闹闹的人。比起静静对视，你们更适合一起玩、一起学，再把精力换成踏实的晚安。",flaw:"精力旺盛又很爱食物，幼犬期可能横冲直撞，运动和饮食管理都不能偷懒。"},{id:"corgi",name:"彭布罗克威尔士柯基",shortName:"柯基",alias:"短腿快乐制造机",emoji:"🐶",color:"#E6C6A7",accent:"#B37B4D",profile:{energy:2,social:2,independence:2,care:1,train:2,space:1,companion:2,climate:1},tags:["机灵有梗","小个子大主见","日常活跃"],quote:"小小的家里，也可以住着一个很有主意的快乐搭子。",copy:"你和柯基都像把可爱与主见装在了一起。你喜欢有来有往的陪伴，也留一点自己的节奏，适合居住空间不算大、但愿意每天互动的人。它会用小表情参与你的生活，你也能欣赏它偶尔的小倔强。",flaw:"掉毛不含糊，还可能爱叫、爱追动的东西；腰椎和体重管理需要长期上心。"},{id:"poodle",name:"贵宾犬（泰迪造型）",shortName:"贵宾犬",alias:"贴心小机灵",emoji:"🐩",color:"#D8C3B5",accent:"#967461",profile:{energy:2,social:2,independence:1,care:3,train:3,space:1,companion:3,climate:2},tags:["聪明细腻","很会察言观色","需要美容"],quote:"真正合拍的伙伴，常常一个眼神就懂你的小心思。",copy:"你细腻、愿意经营关系，也能发现日常里的小变化，和聪明的贵宾很容易形成默契。适合喜欢互动训练、愿意定期美容，又希望家里清爽一些的人。你们会把彼此照顾得很好，也会有很多心照不宣的小习惯。",flaw:"卷毛不打理会打结，太聪明也容易学会“拿捏”；陪伴不足时可能焦虑或爱叫。"},{id:"bichon",name:"比熊犬",shortName:"比熊",alias:"棉花糖治愈家",emoji:"☁️",color:"#E8E5DE",accent:"#AAA398",profile:{energy:1,social:3,independence:0,care:3,train:2,space:0,companion:3,climate:2},tags:["软乎亲人","快乐黏人精","精致打理"],quote:"生活已经够忙了，回家就该被一团软乎乎的喜欢接住。",copy:"你重视被需要、被回应，也舍得为喜欢的东西花心思，和比熊的甜很有共鸣。适合居家时间较多、喜欢亲密陪伴，并愿意认真护理毛发的人。你们会把小家过成柔软的避风港，抱一抱就能消掉一半疲惫。",flaw:"白毛容易有泪痕和污渍，美容频率高；它不是省心摆件，长期独处会很难熬。"},{id:"pomeranian",name:"博美犬",shortName:"博美",alias:"元气小毛球",emoji:"🦊",color:"#E8D0B6",accent:"#B28A67",profile:{energy:2,social:2,independence:1,care:2,train:2,space:0,companion:3,climate:1},tags:["精致元气","好奇警觉","小小表达家"],quote:"个子不用大，认真喜欢你的时候，存在感刚刚好。",copy:"你喜欢鲜活、有回应的小日常，也享受把生活打理得漂亮，和博美的元气很搭。适合小空间居住、愿意互动又重视陪伴的人。它能点亮家里的气氛，你也能接住它那些可爱又认真的小情绪。",flaw:"警惕心强，可能比较爱叫；蓬松毛发要常梳，小型犬也需要规则和边界。"},{id:"shiba",name:"柴犬",shortName:"柴犬",alias:"有边界的室友",emoji:"🦊",color:"#DDBB94",accent:"#A76F43",profile:{energy:2,social:1,independence:3,care:1,train:1,space:2,companion:1,climate:1},tags:["独立清醒","干净自持","有点倔强"],quote:"喜欢不是时刻黏着，是各忙各的，也知道回头就能看见你。",copy:"你珍惜亲密关系，也同样珍惜自己的空间，这一点和柴犬非常合拍。适合不喜欢过度黏腻、尊重彼此天性，同时能接受训练需要耐心的人。你们更像有默契的室友，偶尔贴贴，反而格外珍贵。",flaw:"服从性不是它的追求，召回训练要长期做；换毛季掉毛惊人，倔强也绝不只是人设。"},{id:"samoyed",name:"萨摩耶",shortName:"萨摩耶",alias:"微笑云朵朵",emoji:"🤍",color:"#E7E8E3",accent:"#A5AAA6",profile:{energy:3,social:3,independence:1,care:3,train:2,space:3,companion:3,climate:0},tags:["甜系外向","精力充足","高颜值高维护"],quote:"你向生活露出笑脸，它就带着一身云朵向你跑来。",copy:"你对生活有热情，也愿意为美好付出实际成本，和萨摩耶的明朗气质很合。适合喜欢户外、重视互动，且有时间运动与梳毛的人。你们不只是上镜搭子，更能一起把普通周末过得开阔又明亮。",flaw:"厚毛打理和夏季防暑是长期课题；运动量不够时，甜美笑容背后也可能有个拆家计划。"},{id:"border-collie",name:"边境牧羊犬",shortName:"边牧",alias:"满级事业搭子",emoji:"🐾",color:"#CFD1CB",accent:"#6F7872",profile:{energy:3,social:2,independence:1,care:2,train:3,space:3,companion:2,climate:1},tags:["聪明高敏","精力旺盛","热爱任务"],quote:"最好的默契，是你们都愿意认真，把一件小事越做越好。",copy:"你喜欢学习、反馈和共同进步，和边牧很容易进入“一个眼神就开始配合”的状态。适合精力充足、愿意持续训练并提供脑力活动的人。你给它方向，它给你超出期待的回应，日子会有很强的参与感。",flaw:"聪明不等于好养，精力与脑力无处安放时可能追车、拆家或敏感焦虑，不是只靠遛两圈就够。"},{id:"frenchie",name:"法国斗牛犬",shortName:"法斗",alias:"沙发小丑豆",emoji:"🐽",color:"#D7CEC2",accent:"#8B8073",profile:{energy:0,social:2,independence:1,care:1,train:1,space:0,companion:3,climate:2},tags:["安静搞怪","陪伴取向","低运动需求"],quote:"不出门的下午也不无聊，因为身边有个自带笑点的小家伙。",copy:"你偏爱轻松、近距离的陪伴，不需要生活永远热气腾腾，和法斗的宅家气质很贴。适合小空间、活动节奏舒缓，又愿意关注健康细节的人。你们可以把散步控制得刚刚好，再一起心安理得地窝回沙发。",flaw:"短鼻结构带来呼吸和中暑风险，皮肤褶皱也要清洁；医疗成本与夏季管理需提前考虑。"},{id:"pug",name:"巴哥犬",shortName:"巴哥",alias:"憨憨贴贴怪",emoji:"🐶",color:"#D8C6B3",accent:"#8C7564",profile:{energy:0,social:2,independence:0,care:1,train:1,space:0,companion:3,climate:2},tags:["憨厚黏人","节奏舒缓","居家友好"],quote:"它最擅长的事，就是一脸认真地陪你把日子过慢。",copy:"你要的不是轰轰烈烈，而是回家以后那份踏实又有点好笑的陪伴，巴哥会懂。适合居家时间较多、喜欢贴贴、活动量偏轻的人。你们可以共享很多安静时刻，它负责打呼噜，你负责觉得安心。",flaw:"同样要留意短鼻呼吸、怕热和体重问题；很黏人，独处训练与健康管理都不能忽略。"},{id:"schnauzer",name:"迷你雪纳瑞",shortName:"雪纳瑞",alias:"精神小老头",emoji:"🧔",color:"#C8C8C1",accent:"#737A74",profile:{energy:2,social:1,independence:2,care:2,train:2,space:1,companion:2,climate:2},tags:["机警利落","有原则","造型需维护"],quote:"不需要时时热烈，靠谱又有趣的陪伴反而更长久。",copy:"你欣赏有边界、有性格的伙伴，也愿意把日常照顾做得利落，和雪纳瑞很搭。适合小户型、喜欢适度互动，又能坚持基础训练的人。它有一点小严肃，你懂那其实只是认真参与生活。",flaw:"警惕心可能带来吠叫，胡子和腿部毛发需要清洁修剪；梗犬的小主见也要温柔引导。"},{id:"yorkie",name:"约克夏梗",shortName:"约克夏",alias:"精致小勇豆",emoji:"🎀",color:"#CFC4B7",accent:"#877466",profile:{energy:1,social:1,independence:1,care:3,train:2,space:0,companion:3,climate:2},tags:["小巧精致","勇敢有梗","重视陪伴"],quote:"小小的身影，也有认真爱你、认真表达自己的大能量。",copy:"你对细节有耐心，也喜欢亲密但不必过分喧闹的关系，和约克夏的气质很合。适合小空间、愿意梳毛护理、享受日常互动的人。你负责把生活收拾得妥帖，它负责在每一个细节里陪你。",flaw:"长毛护理很花时间，体型虽小却可能很敢叫、很敢冲；需要训练，也需要防止跌落和误伤。"},{id:"maltese",name:"马尔济斯犬",shortName:"马尔济斯",alias:"温柔白月光",emoji:"🤍",color:"#ECEAE4",accent:"#AAA69D",profile:{energy:1,social:2,independence:0,care:3,train:2,space:0,companion:3,climate:2},tags:["柔软细腻","亲近家人","护理精细"],quote:"温柔不是轻声细语，是每天重复的小事里，都有认真。",copy:"你愿意照顾细节，也珍惜稳定、柔软的陪伴，和马尔济斯的亲密很契合。适合居家时间充足、喜欢梳洗打扮、活动节奏温和的人。你们的关系像一条慢慢织好的围巾，细腻，也很暖。",flaw:"白毛、泪痕和打结都需要耐心；体型娇小可爱不等于脆弱可忽略，陪伴与健康检查都很重要。"},{id:"westie",name:"西高地白梗",shortName:"西高地",alias:"自信小白团",emoji:"🌼",color:"#E4E3DC",accent:"#989B91",profile:{energy:2,social:1,independence:2,care:2,train:1,space:1,companion:1,climate:1},tags:["自信爽朗","独立有趣","梗犬小倔强"],quote:"亲密但不黏腻，各自有趣，也能一起走很远。",copy:"你喜欢有性格、有分寸的伙伴，和自信又独立的西高地很对味。适合生活节奏适中、愿意每天活动，也不想被过度依赖的人。你们的关系轻松里带着欣赏，偶尔的小固执也能成为生活笑点。",flaw:"白色被毛与皮肤需要细心管理，捕猎本能可能带来追逐和挖掘；训练要讲方法，不能硬碰硬。"},{id:"beagle",name:"比格犬",shortName:"比格",alias:"好奇探险家 cent:"#9B775D",profile:{energy:0,social:0,independence:1,care:0,train:1,space:0,companion:3,climate:3},tags:["小巧专一","警惕细腻","偏爱熟人"],quote:"世界很大也没关系，小小的偏爱就已经足够具体。",copy:"你不追求泛泛的热闹，更珍惜少数稳定又亲密的关系，这一点很像吉娃娃。适合小空间、喜欢安静陪伴，能温柔建立安全感的人。它对外可能有点谨慎，但在你身边会很认真地放松。",flaw:"容易因不安而吠叫或防御，也需要社交训练；怕冷、骨骼细小，抱抱和外出都要注意安全。"},{id:"dachshund",name:"腊肠犬",shortName:"腊肠",alias:"勇敢小长条",emoji:"🌭",color:"#D4B69C",accent:"#946E50",profile:{energy:2,social:1,independence:2,care:1,train:1,space:1,companion:2,climate:2},tags:["好奇勇敢","小有个性","探索欲强"],quote:"路线可以很短，好奇心一定要长。",copy:"你喜欢生活有点趣味，也欣赏不盲从的小个性，和腊肠的勇敢很搭。适合小空间、愿意规律散步和耐心互动的人。你们不一定每分钟都黏着，但总能一起发现藏在日常里的新鲜事。",flaw:"长背短腿要格外注意体重、跳跃和楼梯；猎犬天性可能带来追逐、挖掘和一点固执。"},{id:"sheltie",name:"喜乐蒂牧羊犬",shortName:"喜乐蒂",alias:"细腻小绅士",emoji:"🪶",color:"#D8C2A4",accent:"#8D7054",profile:{energy:2,social:1,independence:2,care:3,train:3,space:2,companion:2,climate:1},tags:["敏感细腻","聪明温和","默契互动"],quote:"你给它温柔的确定感，它还你细水长流的默契。",copy:"你观察细、做事有分寸，也喜欢温和而清晰的沟通，和喜乐蒂很合。适合愿意梳毛、规律互动，又不喜欢过度喧闹的人。你们会认真读懂彼此的小信号，把默契藏进每一天。",flaw:"对声音和环境变化可能敏感，也容易用吠叫表达；双层被毛要梳理，幼犬期社会化很重要。"},{id:"old-english",name:"古代英国牧羊犬",shortName:"古牧",alias:"蓬松大玩偶",emoji:"🫧",color:"#D3D4D0",accent:"#838985",profile:{energy:2,social:3,independence:1,care:3,train:2,space:3,companion:3,climate:0},tags:["憨厚亲人","蓬松治愈","护理大户"],quote:"快乐有时候很简单，就是一大团毛茸茸朝你走过来。",copy:"你喜欢热乎、直接的陪伴，也舍得为可爱背后的日常付出，和古牧很合拍。适合空间较足、居家时间多，并愿意把梳毛当长期功课的人。你们的家可能不总是整洁，但一定很有生活气。",flaw:"长毛极易打结，清洁、美容和运动都很费时间；大体格也需要训练，不能只当移动抱枕。"},{id:"chow",name:"松狮犬",shortName:"松狮",alias:"淡定小熊猫",emoji:"🦁",color:"#DCC5A8",accent:"#9A7C59",profile:{energy:1,social:0,independence:3,care:3,train:0,space:2,companion:1,climate:0},tags:["淡定独立","慢热有边界","厚毛需打理"],quote:"不急着亲近所有人，把信任留给真正懂自己的人。",copy:"你慢热、尊重边界，也不把冷淡误读成不喜欢，和松狮的淡定很契合。适合偏爱安静、能接受独立性格，并愿意认真护理厚毛的人。你们的亲密不喧哗，却很稳定、很有分量。",flaw:"需要早期社会化和尊重式训练，不适合强迫社交；厚毛、怕热与本地饲养规定都要提前考虑。"},{id:"cocker",name:"可卡犬",shortName:"可卡",alias:"快乐小甜豆",emoji:"🎗️",color:"#D8BD9D",accent:"#9B7552",profile:{energy:2,social:3,independence:1,care:3,train:2,space:2,companion:3,climate
